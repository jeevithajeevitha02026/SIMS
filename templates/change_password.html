{% extends 'base.html' %}

{% block title %}Change Password - SIMS{% endblock %}
{% block header_title %}Account Security{% endblock %}

{% block content %}
<div style="max-width: 540px; margin: 1rem auto;">
  <div class="card">
    <div class="card-header">
      <h2><i class="fas fa-key" style="color: var(--primary);"></i> Change Account Password</h2>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label for="current_password"><i class="fas fa-lock-open"></i> Current Password *</label>
          <input type="password" id="current_password" name="current_password" class="form-control" placeholder="Enter current password" required autofocus>
        </div>

        <div class="form-group">
          <label for="new_password"><i class="fas fa-lock"></i> New Password *</label>
          <input type="password" id="new_password" name="new_password" class="form-control" placeholder="At least 6 characters" required>
        </div>

        <div class="form-group">
          <label for="confirm_password"><i class="fas fa-check-double"></i> Confirm New Password *</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat new password" required>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary"><i class="fas fa-shield-alt"></i> Update Password</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
