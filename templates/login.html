<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Student Information Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <h1>SIMS Portal</h1>
      <p>Student Information Management System</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alert-wrapper">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
              <div class="alert-content">
                <i class="fas fa-info-circle"></i>
                <span>{{ message }}</span>
              </div>
              <button type="button" class="alert-close" onclick="this.parentElement.remove()">&times;</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="username"><i class="fas fa-user"></i> Username or Roll Number</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin, prof_smith, CS202601" required autofocus>
      </div>

      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        <i class="fas fa-sign-in-alt"></i> Sign In to Portal
      </button>
    </form>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
